<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Discount | Ctong0622</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, rgb(240, 244, 255), rgb(253, 242, 248));
            color: rgb(45, 45, 45);
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px 40px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        h1 {
            font-size: 2.5em;
            color: rgb(75, 63, 114);
            text-align: center;
            border-bottom: 3px solid rgb(167, 139, 250);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .discount-card {
            background: rgba(255, 255, 255, 0.75);
            border-radius: 12px;
            padding: 25px 30px 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        label {
            font-weight: bold;
        }

        .discount-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        #totalInput {
            flex: 1;
            padding: 10px 14px;
            font-size: 1rem;
            border: 2px solid rgb(216, 200, 245);
            border-radius: 8px;
            background: white;
        }

        #totalInput:focus {
            outline: none;
            border-color: rgb(109, 40, 217);
        }

        .member-row {
            margin-top: 15px;
        }

        #checkButton {
            margin-top: 15px;
            padding: 10px 18px;
            font-size: 1rem;
            background: rgb(109, 40, 217);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        #checkButton:hover {
            background: rgb(87, 30, 173);
        }

        #result {
            margin-top: 15px;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>Member Discount</h1>
    </header>

    <main>
        <div class="discount-card">
            <label for="totalInput">Cart total ($):</label>
            <div class="discount-row">
                <input type="number" id="totalInput" placeholder="Enter your cart total" />
            </div>

            <div class="member-row">
                <label>
                    <input type="checkbox" id="memberCheckbox" />
                    I am a member
                </label>
            </div>

            <button type="button" id="checkButton">Check Discount</button>
            <p id="result"></p>
        </div>
    </main>

    <script>
        function getDiscount(total, isMember) {
            if (total >= 100 && isMember) {
                return 20;
            } else if (total >= 100 || isMember) {
                return 10;
            } else {
                return 0;
            }
        }

        const totalInput = document.getElementById('totalInput');
        const memberCheckbox = document.getElementById('memberCheckbox');
        const checkButton = document.getElementById('checkButton');
        const result = document.getElementById('result');

        checkButton.addEventListener('click', () => {
            const total = Number(totalInput.value);
            const isMember = memberCheckbox.checked;
            const discount = getDiscount(total, isMember);
            const finalPrice = total - discount;
            result.textContent = `Your discount is $${discount}. Final price: $${finalPrice}`;
        });
    </script>
</body>
</html>
