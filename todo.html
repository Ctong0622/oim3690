<body>
    <header>
        <nav class="site-nav">
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="navLinks">

        </nav>
        <h1>To-Do List</h1>
    </header>

    <main>
        <div class="todo-card">
            <form id="todoForm">
                <label for="todoInput">New task:</label>
                <div class="todo-input-row">
                    <input type="text" id="todoInput" name="todoInput" placeholder="Add a task..." required />
                    <button type="submit">Add</button>
                </div>
            </form>

            <ul id="todoList"></ul>
            <p id="emptyMessage" class="empty-message">No tasks yet. Add one above to get started!</p>

            <div class="todo-footer">
                <span id="taskCount">0 tasks remaining</span>
                <button type="button" id="clearCompleted">Clear Completed</button>
            </div>
        </div>
    </main>

    <footer>
        <address>
            Reach me on <a href="https://github.com/Ctong0622">GitHub</a>.
        </address>
    </footer>

    <script src="js/nav.js" defer></script>
    <script src="js/todo.js" defer></script>
