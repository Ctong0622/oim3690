<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post to the Message Board</title>
</head>

<body>
    <h1>Post to the Message Board</h1>

    <input type="text" id="messageInput" placeholder="Type your message here" />
    <button id="postButton">Post Message</button>

    <script>
        async function postMessage(text) {
            const response = await fetch("https://oim.zhili.dev/message", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-Token": "Ctong0622"
                },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            console.log(data);
        }

        // Send an initial test message when the page loads
        postMessage("Hello from Charles!");

        // Let the user post whatever they type in the input box
        const postButton = document.getElementById("postButton");
        const messageInput = document.getElementById("messageInput");

        postButton.addEventListener("click", () => {
            postMessage(messageInput.value);
        });
    </script>
</body>
</html>
